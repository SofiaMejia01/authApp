
<div class="wrap-login100 p-l-55 p-r-55 p-t-65 p-b-54">
    <form class="login100-form" autocomplete="off" [formGroup]="myForm" (ngSubmit)="registrar()">

        <span class="login100-form-title p-b-49">
            Registrate
        </span>
    
        <div class="row">
            <div class="col-md-6">
                <div  class="m-b-23">
                    <div class="wrap-input100 m-b-23">
                      <span class="label-input100">Nombres</span>
                      <input class="input100"
                             type="name"
                             formControlName="name"
                             placeholder="Nombres">
                      <span class="focus-input100"></span>
                    </div>
                    <span *ngIf="isValidField('name')" class="form-text text-danger">Ingrese su nombre</span>
                 </div>
                  
                 <div class="m-b-23">
                  <div class="wrap-input100 m-b-23">
                      <span class="label-input100">Apellidos</span>
                       <input class="input100"
                         type="apellido"
                         formControlName="apellido"
                         placeholder="Apellidos">
                      <span class="focus-input100"></span>
                  </div>
                  <span *ngIf="isValidField('apellido')" class="form-text text-danger">Ingrese su apellido</span>
                 </div>
                  
              
                 <div class="m-b-23">
                    <div class="wrap-input100 m-b-23">
                      <span class="label-input100">Correo</span>
                      <input class="input100"
                             type="email"
                             formControlName="email"
                             placeholder="Correo electrónico">
                      <span class="focus-input100"></span>
                    </div>
                    <span *ngIf="isValidField('email')" class="form-text text-danger">Ingrese un correo valido</span>
                  </div>
                 
              
            </div>
    
            <div class="col-md-6">
                <div class="m-b-23">
                    <div class="wrap-input100 m-b-23" >
                        <span class="label-input100">Contraseña</span>
                        <input class="input100"
                               type="password"
                               formControlName="password"
                               placeholder="Ingrese su contraseña">
                        <span class="focus-input100"></span>
                       
                    </div>
                    <span *ngIf="isValidField('password')" class="form-text text-danger">La contraseña debe tener entre 6-10 caracteres</span>
                </div>
             
            
                <div class="m-b-23">
                    <div class="wrap-input100 m-b-23">
                        <span class="label-input100">Confirmar contraseña</span>
                        <input class="input100"
                               type="password"
                               formControlName="password2"
                               placeholder="Vuelva a ingresar la contraseña">
                        <span class="focus-input100"></span>  
                    </div>
                    <span *ngIf="isValidField('password2')" class="form-text text-danger">Las contraseñas deben ser iguales</span>
                </div>
               
               
            
               
            
              
            
            </div>
        </div>
        <div class="text-right p-t-8 p-b-31"></div>
        <div class="container-login100-form-btn">
            <div class="wrap-login100-form-btn">
                <div class="login100-form-bgbtn"></div>
                <button class="login100-form-btn"
                        [disabled]="myForm.invalid"
                        type="submit">
                    Registrate
                </button>
            </div>
        </div>
       
        
        <div class="flex-col-c p-t-60">
            <span class="txt1 p-b-17">
                ¿Ya tienes una cuenta?
            </span>
    
            <a routerLink="/auth/login" class="txt2">
               Ir al LogIn
            </a>
        </div>
    </form>
</div>
